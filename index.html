<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Comissão de Frete</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363d;
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #58a6ff;
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #8b949e;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #f0f6fc;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .result-box {
            background-color: #21262d;
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
            border-left: 4px solid #2ea44f;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .result-item:last-child {
            margin-bottom: 0;
        }
        .result-value {
            font-weight: bold;
            color: #58a6ff;
        }
        .highlight {
            color: #2ea44f;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cálculo de Frete</h2>
    
    <div class="input-group">
        <label for="frete">Valor Total do Frete (R$)</label>
        <input type="number" id="frete" placeholder="Ex: 2500" oninput="calcular()">
    </div>
    
    <div class="input-group">
        <label for="comissao">Sua Comissão Fixa (R$)</label>
        <input type="number" id="comissao" placeholder="Ex: 250" oninput="calcular()">
    </div>
    
    <div class="result-box">
        <div class="result-item">
            <span>Porcentagem Descontada:</span>
            <span id="porcentagem" class="result-value highlight">0%</span>
        </div>
        <div class="result-item">
            <span>Valor Líquido do Frete:</span>
            <span id="liquido" class="result-value">R$ 0,00</span>
        </div>
    </div>
</div>

<script>
function calcular() {
    const valorFrete = parseFloat(document.getElementById('frete').value) || 0;
    const valorComissao = parseFloat(document.getElementById('comissao').value) || 0;
    
    const porcentagemEl = document.getElementById('porcentagem');
    const liquidoEl = document.getElementById('liquido');
    
    if (valorFrete > 0) {
        const porcentagem = (valorComissao / valorFrete) * 100;
        const liquido = valorFrete - valorComissao;
        
        porcentagemEl.innerText = porcentagem.toFixed(2) + '%';
        liquidoEl.innerText = 'R$ ' + liquido.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    } else {
        porcentagemEl.innerText = '0%';
        liquidoEl.innerText = 'R$ 0,00';
    }
}
</script>

</body>
</html>
